# Local development infrastructure only. Production deployment
# configuration (secrets management, TLS, backups, scaling) is Phase 10.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aurelia
      POSTGRES_PASSWORD: aurelia_dev_password
      POSTGRES_DB: aurelia
    ports:
      - "5432:5432"
    volumes:
      - aurelia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurelia"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aurelia_postgres_data: